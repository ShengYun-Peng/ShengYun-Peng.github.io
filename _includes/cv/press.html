<div class="cv-entry cv-entry-compact">
<div class="cv-entry-content">
<div class="press-line">"{% if press.link %}<a href="{{ press.link }}">{{ press.title }}</a>{% else %}{{ press.title }}{% endif %}"<span class="press-publisher">{{ press.publisher }}</span>{% if press.language %}<span class="press-language">{{ press.language }}</span>{% endif %}</div>
</div>
<div class="cv-entry-date">{{ press.month }} {{ press.year }}</div>
</div>
